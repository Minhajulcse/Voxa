<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomChat - Live Messaging</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-main: #0b141a;
            --bg-side: #111b21;
            --panel: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent: #00a884;
            --bubble-me: #005c4b;
            --bubble-other: #202c33;
            --border-color: #222d34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* Login & Settings Modal Overlay */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { background: var(--bg-side); padding: 30px; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-card h2 { color: var(--accent); margin-bottom: 10px; }
        .modal-card input { width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 16px; margin: 10px 0; outline: none; }
        .modal-card button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .modal-card button:hover { opacity: 0.9; }

        /* App Container */
        .app-container { width: 100vw; height: 100vh; max-width: 1400px; display: flex; background: var(--bg-side); overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 340px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: var(--bg-side); }
        .user-profile-bar { padding: 15px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .user-profile-left { display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer; }
        .user-profile-left:hover { opacity: 0.8; }
        .user-profile-bar .name { font-weight: bold; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .settings-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 5px; }
        .settings-btn:hover { color: var(--text-primary); }

        .online-list-header { padding: 12px 15px; font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .chat-list { flex: 1; overflow-y: auto; list-style: none; }
        .chat-item { padding: 14px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--panel); }
        
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); display: flex; justify-content: center; align-items: center; font-weight: bold; position: relative; border: 1px solid var(--border-color); flex-shrink: 0; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #25d366; position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-side); }
        
        .chat-info { flex: 1; overflow: hidden; }
        .chat-info .title { font-weight: 500; font-size: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;}
        .chat-info .subtitle { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center;}
        
        .subtitle.unread { font-weight: bold; color: var(--text-primary); }
        .unread-badge { background: #25d366; color: #111b21; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; margin-left: 5px; line-height: 1;}

        /* Main Chat Window */
        .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .chat-header { padding: 15px 20px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .chat-header-info h3 { font-size: 16px; margin-bottom: 2px; }
        .chat-header-info span { font-size: 12px; color: var(--text-secondary); }

        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; display: inline-block; }
        .message.sent { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 0; }
        .message.received { align-self: flex-start; background: var(--bubble-other); border-top-left-radius: 0; }
        .msg-sender { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 3px; }
        .msg-time { font-size: 10px; color: var(--text-secondary); float: right; margin-left: 10px; margin-top: 5px; }

        /* Message Input */
        .input-bar { padding: 12px 20px; background: var(--panel); display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-color); }
        .input-bar input { flex: 1; padding: 12px 15px; background: var(--bg-side); border: 1px solid var(--border-color); border-radius: 25px; color: #fff; font-size: 15px; outline: none; }
        .input-bar button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .input-bar button:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .chat-window { height: 65%; }
        }
    </style>
</head>
<body>

    <!-- First Time Login Modal -->
    <div id="loginOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>RoomChat Pro 💬</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 15px;">চ্যাট শুরু করতে আপনার নাম এবং প্রোফাইল পিকচারের লিংক (বা ইমোজি) দিন</p>
            <input type="text" id="regNameInput" placeholder="আপনার নাম..." autocomplete="off">
            <input type="text" id="regAvatarInput" placeholder="প্রোফাইল ছবির লিংক (ঐচ্ছিক) বা ইমোজি 👤" autocomplete="off">
            <div style="margin:8px 0;color:var(--text-secondary);font-size:12px;">অথবা ছবি আপলোড করুন</div>
            <input type="file" id="regAvatarFile" accept="image/*" style="width:100%;color:var(--text-secondary);font-size:13px;margin:4px 0 8px;">
            <button onclick="registerUser()">অ্যাকাউন্ট তৈরি করুন</button>
        </div>
    </div>

    <!-- Edit Profile / Settings Modal -->
    <div id="settingsOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>প্রোফাইল সেটিংস ⚙️</h2>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 15px;">আপনার নাম বা ছবি পরিবর্তন করুন</p>
            <input type="text" id="editNameInput" placeholder="নতুন নাম..." autocomplete="off">
            <input type="text" id="editAvatarInput" placeholder="ছবির লিংক বা ইমোজি..." autocomplete="off">
            <div style="margin:8px 0;color:var(--text-secondary);font-size:12px;">অথবা ছবি আপলোড করুন</div>
            <input type="file" id="editAvatarFile" accept="image/*" style="width:100%;color:var(--text-secondary);font-size:13px;margin:4px 0 8px;">
            <button onclick="saveProfileChanges()">সংরক্ষণ করুন</button>
            <button onclick="closeSettings()" style="background: #334155; margin-top: 5px;">বাতিল</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="user-profile-bar">
                <div class="user-profile-left" onclick="openSettings()">
                    <div class="avatar" id="mySidebarAvatar">👤</div>
                    <div class="name" id="myProfileName">লোড হচ্ছে...</div>
                </div>
                <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
            </div>

            <div class="online-list-header">কথোপকথন ও অনলাইন ইউজার</div>
            <ul class="chat-list" id="chatList">
                <!-- Sidebar items -->
            </ul>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3 id="currentChatTitle">🌐 গ্লোবাল চ্যাট রুম</h3>
                    <span id="currentChatStatus">Global Channel</span>
                </div>
            </div>

            <div class="messages-box" id="messagesBox">
                <!-- Messages -->
            </div>

            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="মেসেজ লিখুন..." autocomplete="off" onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwAWShdsGnzlL25_0PwhBHbNNW9BvN6j0",
            authDomain: "roomchat-13d45.firebaseapp.com",
            databaseURL: "https://roomchat-13d45-default-rtdb.firebaseio.com",
            projectId: "roomchat-13d45",
            storageBucket: "roomchat-13d45.firebasestorage.app",
            messagingSenderId: "859702863241",
            appId: "1:859702863241:web:b3c1b66fd252781f852d58"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // পার্মানেন্ট ইউনিক আইডি যা ব্রাউজারে স্থায়ীভাবে সেভ থাকবে
        let myUid = localStorage.getItem('pro_chat_permanent_uid');
        if (!myUid) {
            myUid = 'u_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
            localStorage.setItem('pro_chat_permanent_uid', myUid);
        }

        let myName = localStorage.getItem('pro_chat_name');
        let myAvatar = localStorage.getItem('pro_chat_avatar') || '👤';

        let currentChatType = 'global'; 
        let targetUid = null;
        let targetName = 'গ্লোবাল চ্যাট রুম';
        let activeListenerRef = null;

        let onlineUsers = {};
        let recentChats = {};
        let allUserProfiles = {};

        window.onload = () => {
            if (!myName) {
                document.getElementById('loginOverlay').style.display = 'flex';
            } else {
                initApp();
            }
        };

        async function registerUser() {
            const name = document.getElementById('regNameInput').value.trim();
            const avatarInput = document.getElementById('regAvatarInput').value.trim();
            const file = document.getElementById('regAvatarFile').files[0];
            if (!name) {
                alert("দয়া করে আপনার নাম লিখুন!");
                return;
            }

            try {
                myName = name;
                myAvatar = file ? await uploadAvatar(file) : (avatarInput || '👤');
                localStorage.setItem('pro_chat_name', myName);
                localStorage.setItem('pro_chat_avatar', myAvatar);

                document.getElementById('loginOverlay').style.display = 'none';
                initApp();
            } catch (error) {
                console.error(error);
                alert("প্রোফাইল ছবি আপলোড করা যায়নি। আবার চেষ্টা করুন।");
            }
        }

        function initApp() {
            // ফায়ারবেসে ইউজারের স্থায়ী প্রোফাইল আপডেট বা সেভ করা
            db.ref(`users/${myUid}`).set({
                name: myName,
                avatar: myAvatar,
                uid: myUid
            });

            updateMyUI();
            setupPresence();
            listenToSidebarData();
            switchChat('global', '🌐 গ্লোবাল চ্যাট রুম');
        }

        function updateMyUI() {
            document.getElementById('myProfileName').innerText = myName;
            const avatarDiv = document.getElementById('mySidebarAvatar');
            if (myAvatar.startsWith('http')) {
                avatarDiv.innerHTML = '';
                const img = document.createElement('img');
                img.src = myAvatar;
                img.alt = 'Avatar';
                avatarDiv.appendChild(img);
            } else {
                avatarDiv.textContent = myAvatar;
            }
        }

        // সেটিংস মডাল ওপেন/ক্লোজ
        function openSettings() {
            document.getElementById('editNameInput').value = myName;
            document.getElementById('editAvatarInput').value = myAvatar;
            document.getElementById('settingsOverlay').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').style.display = 'none';
        }

        async function saveProfileChanges() {
            const newName = document.getElementById('editNameInput').value.trim();
            const avatarInput = document.getElementById('editAvatarInput').value.trim();
            const file = document.getElementById('editAvatarFile').files[0];
            if (!newName) {
                alert("নাম খালি রাখা যাবে না!");
                return;
            }

            try {
                const newAvatar = file ? await uploadAvatar(file) : (avatarInput || '👤');
                myName = newName;
                myAvatar = newAvatar;
                localStorage.setItem('pro_chat_name', myName);
                localStorage.setItem('pro_chat_avatar', myAvatar);

                await db.ref(`users/${myUid}`).update({
                    name: myName,
                    avatar: myAvatar
                });

                updateMyUI();
                closeSettings();
                document.getElementById('editAvatarFile').value = '';
            } catch (error) {
                console.error(error);
                alert("প্রোফাইল আপডেট করা যায়নি। আবার চেষ্টা করুন।");
            }
        }

        async function uploadAvatar(file) {
            if (!file.type.startsWith('image/')) throw new Error('Invalid image');
            if (file.size > 2 * 1024 * 1024) throw new Error('Image too large');
            const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
            const ref = storage.ref(`avatars/${myUid}.${ext}`);
            await ref.put(file);
            return await ref.getDownloadURL();
        }

        // লাইভ প্রেজেন্স ও প্রোফাইল ক্যাশ করা
        function setupPresence() {
            const myPresenceRef = db.ref(`presence/${myUid}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    myPresenceRef.onDisconnect().remove();
                    myPresenceRef.set({
                        uid: myUid,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });
        }

        function listenToSidebarData() {
            // ১. সব ইউজারের প্রোফাইল ইনফো ট্র্যাক করা (যাতে সবার সঠিক নাম ও ছবি পাওয়া যায়)
            db.ref('users').on('value', (snapshot) => {
                allUserProfiles = snapshot.val() || {};
                renderSidebar();
            });

            // ২. অনলাইন ইউজার ট্র্যাক করা
            db.ref('presence').on('value', (snapshot) => {
                onlineUsers = snapshot.val() || {};
                renderSidebar();
            });

            // ৩. নিজের রিসেন্ট চ্যাট ট্র্যাক করা
            db.ref(`recent_chats/${myUid}`).on('value', (snapshot) => {
                recentChats = snapshot.val() || {};
                if (currentChatType === 'private' && targetUid && recentChats[targetUid]?.unread) {
                    db.ref(`recent_chats/${myUid}/${targetUid}/unread`).set(false);
                }
                renderSidebar();
            });
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            
            list.innerHTML = `
                <li class="chat-item ${currentChatType === 'global' ? 'active' : ''}" onclick="switchChat('global', '🌐 গ্লোবাল চ্যাট রুম')">
                    <div class="avatar">🌐</div>
                    <div class="chat-info">
                        <div class="title">গ্লোবাল চ্যাট রুম</div>
                        <div class="subtitle">সবার জন্য উন্মুক্ত চ্যাট</div>
                    </div>
                </li>
            `;

            let sidebarItems = [];

            // মেসেজ দেওয়া ইউজারদের লিস্টে আনা
            Object.keys(recentChats).forEach(uid => {
                const p = allUserProfiles[uid] || { name: 'Unknown', avatar: '👤' };
                sidebarItems.push({
                    uid: uid,
                    name: p.name,
                    avatar: p.avatar,
                    isOnline: !!onlineUsers[uid],
                    timestamp: recentChats[uid].timestamp || 0,
                    text: recentChats[uid].text,
                    unread: recentChats[uid].unread
                });
            });

            // অনলাইন ইউজার যারা মেসেজ দেয়নি
            Object.keys(onlineUsers).forEach(uid => {
                if (uid !== myUid && !recentChats[uid]) {
                    const p = allUserProfiles[uid] || { name: 'User', avatar: '👤' };
                    sidebarItems.push({
                        uid: uid,
                        name: p.name,
                        avatar: p.avatar,
                        isOnline: true,
                        timestamp: 0, 
                        text: 'কথোপকথন শুরু করুন',
                        unread: false
                    });
                }
            });

            // টাইমস্ট্যাম্প অনুযায়ী রিসেন্ট চ্যাট উপরে সাজানো
            sidebarItems.sort((a, b) => b.timestamp - a.timestamp);

            sidebarItems.forEach(u => {
                const timeStr = u.timestamp ? new Date(u.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                const unreadBadge = u.unread ? `<div class="unread-badge">New</div>` : '';
                const subtitleClass = u.unread ? 'subtitle unread' : 'subtitle';
                const statusDot = u.isOnline ? `<div class="status-dot"></div>` : '';

                const li = document.createElement('li');
                li.className = `chat-item ${targetUid === u.uid ? 'active' : ''}`;
                li.onclick = () => switchChat(u.uid, u.name);

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (u.avatar && u.avatar.startsWith('http')) {
                    const img = document.createElement('img');
                    img.src = u.avatar;
                    img.alt = 'Avatar';
                    avatar.appendChild(img);
                } else {
                    avatar.textContent = u.avatar || '👤';
                }
                if (u.isOnline) {
                    const dot = document.createElement('div');
                    dot.className = 'status-dot';
                    avatar.appendChild(dot);
                }

                const info = document.createElement('div');
                info.className = 'chat-info';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'title';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = u.name || 'Unknown';
                const timeSpan = document.createElement('span');
                timeSpan.style.cssText = 'font-size:10px;color:var(--text-secondary);font-weight:normal;';
                timeSpan.textContent = timeStr;
                titleDiv.append(nameSpan, timeSpan);

                const subDiv = document.createElement('div');
                subDiv.className = subtitleClass;
                const textSpan = document.createElement('span');
                textSpan.style.cssText = 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%;';
                textSpan.textContent = u.text || '';
                subDiv.appendChild(textSpan);
                if (u.unread) {
                    const badge = document.createElement('div');
                    badge.className = 'unread-badge';
                    badge.textContent = 'New';
                    subDiv.appendChild(badge);
                }

                info.append(titleDiv, subDiv);
                li.append(avatar, info);
                list.appendChild(li);
            });
        }

        function switchChat(type, title) {
            currentChatType = (type === 'global') ? 'global' : 'private';
            targetUid = (type === 'global') ? null : type;
            targetName = title;

            document.getElementById('currentChatTitle').innerText = title;
            document.getElementById('currentChatStatus').innerText = (type === 'global') ? 'Public Room' : 'Direct Message (🔒 Private)';

            if (currentChatType === 'private' && recentChats[targetUid] && recentChats[targetUid].unread) {
                db.ref(`recent_chats/${myUid}/${targetUid}/unread`).set(false);
            }

            renderSidebar();

            if (activeListenerRef) activeListenerRef.off();
            const messagesBox = document.getElementById('messagesBox');
            messagesBox.innerHTML = '';

            let chatPath = (currentChatType === 'global') ? 'messages/global' : `messages/private/${[myUid, targetUid].sort().join('_')}`;

            activeListenerRef = db.ref(chatPath).limitToLast(60);
            activeListenerRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                renderMessage(msg);
            });
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const ts = firebase.database.ServerValue.TIMESTAMP;
            const msgData = {
                senderUid: myUid,
                senderName: myName,
                senderAvatar: myAvatar,
                text: text,
                timestamp: ts
            };

            const updates = {};

            if (currentChatType === 'global') {
                const newMsgKey = db.ref('messages/global').push().key;
                updates[`messages/global/${newMsgKey}`] = msgData;
            } else {
                const dmId = [myUid, targetUid].sort().join('_');
                const newMsgKey = db.ref(`messages/private/${dmId}`).push().key;
                updates[`messages/private/${dmId}/${newMsgKey}`] = msgData;

                updates[`recent_chats/${myUid}/${targetUid}`] = {
                    timestamp: ts,
                    text: text,
                    unread: false,
                    partnerName: targetName
                };
                updates[`recent_chats/${targetUid}/${myUid}`] = {
                    timestamp: ts,
                    text: text,
                    unread: true,
                    partnerName: myName
                };
            }

            db.ref().update(updates)
                .then(() => {
                    input.value = '';
                })
                .catch(error => {
                    console.error(error);
                    alert("Message পাঠানো যায়নি। আবার চেষ্টা করুন।");
                });
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessage(msg) {
            const box = document.getElementById('messagesBox');
            const isMe = msg.senderUid === myUid;
            
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'sent' : 'received'}`;
            
            const timeString = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

            div.innerHTML = `
                ${!isMe ? `<div class="msg-sender">${escapeHTML(msg.senderName || 'Unknown')}</div>` : ''}
                <div>${escapeHTML(msg.text)}</div>
                <div class="msg-time">${timeString}</div>
            `;

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
