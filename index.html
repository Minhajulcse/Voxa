<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomChat - Live Messaging</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-main: #0b141a;
            --bg-side: #111b21;
            --panel: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent: #00a884;
            --bubble-me: #005c4b;
            --bubble-other: #202c33;
            --border-color: #222d34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* Login & Settings Modal Overlay */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { background: var(--bg-side); padding: 30px; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-card h2 { color: var(--accent); margin-bottom: 10px; }
        .modal-card input { width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 16px; margin: 10px 0; outline: none; }
        .modal-card button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .modal-card button:hover { opacity: 0.9; }

        /* App Container */
        .app-container { width: 100vw; height: 100vh; max-width: 1400px; display: flex; background: var(--bg-side); overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 340px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: var(--bg-side); }
        .user-profile-bar { padding: 15px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .user-profile-left { display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer; }
        .user-profile-left:hover { opacity: 0.8; }
        .user-profile-bar .name { font-weight: bold; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .settings-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 5px; }
        .settings-btn:hover { color: var(--text-primary); }

        .online-list-header { padding: 12px 15px; font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .chat-list { flex: 1; overflow-y: auto; list-style: none; }
        .chat-item { padding: 14px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: var(--panel); }
        
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); display: flex; justify-content: center; align-items: center; font-weight: bold; position: relative; border: 1px solid var(--border-color); flex-shrink: 0; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .status-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #25d366;
            position: absolute;
            bottom: 1px;
            right: 1px;
            border: 2px solid var(--bg-side);
            box-shadow: 0 0 0 1px rgba(37,211,102,.25);
            z-index: 3;
        }
        
        .chat-info { flex: 1; overflow: hidden; }
        .chat-info .title { font-weight: 500; font-size: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;}
        .chat-info .subtitle { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center;}
        
        .subtitle.unread { font-weight: bold; color: var(--text-primary); }
        .unread-badge { background: #25d366; color: #111b21; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; margin-left: 5px; line-height: 1;}

        /* Main Chat Window */
        .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .chat-header { padding: 15px 20px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .chat-header-info h3 { font-size: 16px; margin-bottom: 2px; }
        .chat-header-info span { font-size: 12px; color: var(--text-secondary); }

        .messages-box { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; display: inline-block; }
        .message.sent { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 0; }
        .message.received { align-self: flex-start; background: var(--bubble-other); border-top-left-radius: 0; }
        .msg-sender { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 3px; }
        .msg-time { font-size: 10px; color: var(--text-secondary); float: right; margin-left: 10px; margin-top: 5px; }
        .msg-status { font-size: 11px; margin-left: 4px; font-weight: bold; }
        .msg-status.sent { color: var(--text-secondary); }
        .msg-status.delivered { color: var(--text-secondary); }
        .msg-status.seen { color: #53bdeb; }
        .message-actions { display: none; position: absolute; top: 4px; right: 5px; background: var(--panel); border-radius: 6px; padding: 3px; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
        @media (hover: hover) and (pointer: fine) {
            }
        .message-actions button { border: none; background: transparent; color: var(--text-secondary); font-size: 11px; cursor: pointer; padding: 3px 5px; }
        .message-actions button:hover { color: var(--text-primary); }
        .unsent-message { color: var(--text-secondary); font-style: italic; }
        .chat-header-info .presence { color: var(--text-secondary); }

        /* Message Input */
        .input-bar { padding: 12px 20px; background: var(--panel); display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-color); }
        .input-bar input { flex: 1; padding: 12px 15px; background: var(--bg-side); border: 1px solid var(--border-color); border-radius: 25px; color: #fff; font-size: 15px; outline: none; }
        .input-bar button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .input-bar button:hover { opacity: 0.9; }
    
        .msg-action-btn {
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 30px;
            min-height: 28px;
        }
        .msg-action-btn:hover { background: rgba(255,255,255,.08); color: var(--text-primary); }
        @media (hover: none), (pointer: coarse) {
            .message-actions { display: none; opacity: 1; }
            .message-actions.touch-visible { display: flex; }
            .msg-action-btn { min-width: 34px; min-height: 32px; font-size: 15px; }
        }
        @media (max-width: 900px) {
            body { align-items: stretch; overflow: hidden; }
            .app-container { width:100%; height:100dvh; max-width:none; flex-direction:column; }
            .sidebar { width:100%; height:34dvh; min-height:185px; border-right:none; border-bottom:1px solid var(--border-color); }
            .chat-window { height:66dvh; min-height:0; }
            .chat-header { padding:11px 13px; min-height:60px; }
            .messages-box { padding:11px 9px; gap:8px; }
            .message { max-width:86%; font-size:14px; }
            .input-bar { padding:8px 9px calc(8px + env(safe-area-inset-bottom)); gap:7px; }
            .input-bar input { min-width:0; font-size:16px; padding:11px 13px; }
            .input-bar button { min-width:60px; padding:10px 13px; }
            .user-profile-bar { padding:9px 11px; }
            .chat-item { padding:9px 11px; }
            .modal-card { width:calc(100% - 26px); max-width:420px; padding:21px 17px; }
        }
        @media (max-width:520px) {
            .sidebar { height:31dvh; min-height:170px; }
            .chat-window { height:69dvh; }
            .avatar { width:38px; height:38px; }
            .message { max-width:91%; }
        }
    </style>
</head>
<body>

    <!-- First Time Login Modal -->
    <div id="loginOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>RoomChat Pro 💬</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 15px;">চ্যাট শুরু করতে আপনার নাম এবং প্রোফাইল পিকচারের লিংক (বা ইমোজি) দিন</p>
            <input type="text" id="regNameInput" placeholder="আপনার নাম..." autocomplete="off">
            <input type="text" id="regAvatarInput" placeholder="ছবির লিংক অথবা emoji 😀 👤 🚀" autocomplete="off">
            <div style="margin:8px 0;color:var(--text-secondary);font-size:12px;">অথবা ছবি আপলোড করুন</div>
            <input type="file" id="regAvatarFile" accept="image/*" style="width:100%;color:var(--text-secondary);font-size:13px;margin:4px 0 8px;">
            <button onclick="registerUser()">অ্যাকাউন্ট তৈরি করুন</button>
        </div>
    </div>

    <!-- Edit Profile / Settings Modal -->
    <div id="settingsOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h2>প্রোফাইল সেটিংস ⚙️</h2>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 15px;">আপনার নাম বা ছবি পরিবর্তন করুন</p>
            <input type="text" id="editNameInput" placeholder="নতুন নাম..." autocomplete="off">
            <input type="text" id="editAvatarInput" placeholder="ছবির লিংক বা ইমোজি..." autocomplete="off">
            <div style="margin:8px 0;color:var(--text-secondary);font-size:12px;">অথবা ছবি আপলোড করুন</div>
            <input type="file" id="editAvatarFile" accept="image/*" style="width:100%;color:var(--text-secondary);font-size:13px;margin:4px 0 8px;">
            <button onclick="saveProfileChanges()">সংরক্ষণ করুন</button>
            <button onclick="closeSettings()" style="background: #334155; margin-top: 5px;">বাতিল</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="user-profile-bar">
                <div class="user-profile-left" onclick="openSettings()">
                    <div class="avatar" id="mySidebarAvatar">👤</div>
                    <div class="name" id="myProfileName">লোড হচ্ছে...</div>
                </div>
                <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
            </div>

            <div class="online-list-header">কথোপকথন ও অনলাইন ইউজার</div>
            <ul class="chat-list" id="chatList">
                <!-- Sidebar items -->
            </ul>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-window">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3 id="currentChatTitle">🌐 গ্লোবাল চ্যাট রুম</h3>
                    <span id="currentChatStatus" class="presence">Global Channel</span>
                </div>
            </div>

            <div class="messages-box" id="messagesBox">
                <!-- Messages -->
            </div>

            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="মেসেজ লিখুন..." autocomplete="off" onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwAWShdsGnzlL25_0PwhBHbNNW9BvN6j0",
            authDomain: "roomchat-13d45.firebaseapp.com",
            databaseURL: "https://roomchat-13d45-default-rtdb.firebaseio.com",
            projectId: "roomchat-13d45",
            storageBucket: "roomchat-13d45.firebasestorage.app",
            messagingSenderId: "859702863241",
            appId: "1:859702863241:web:b3c1b66fd252781f852d58"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // পার্মানেন্ট ইউনিক আইডি যা ব্রাউজারে স্থায়ীভাবে সেভ থাকবে
        let myUid = localStorage.getItem('pro_chat_permanent_uid');
        if (!myUid) {
            myUid = 'u_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
            localStorage.setItem('pro_chat_permanent_uid', myUid);
        }

        let myName = localStorage.getItem('pro_chat_name');
        let myAvatar = localStorage.getItem('pro_chat_avatar') || '👤';

        let currentChatType = 'global'; 
        let targetUid = null;
        let targetName = 'গ্লোবাল চ্যাট রুম';
        let activeListenerRef = null;

        let onlineUsers = {};
        let recentChats = {};
        let allUserProfiles = {};
        let deletedMessages = JSON.parse(localStorage.getItem('pro_chat_deleted_messages') || '{}');

        window.onload = () => {
            if (!myName) {
                document.getElementById('loginOverlay').style.display = 'flex';
            } else {
                initApp();
            }
        };

        async function registerUser() {
            const name = document.getElementById('regNameInput').value.trim();
            const avatarInput = document.getElementById('regAvatarInput').value.trim();
            const file = document.getElementById('regAvatarFile').files[0];
            if (!name) {
                alert("দয়া করে আপনার নাম লিখুন!");
                return;
            }

            try {
                myName = name;
                myAvatar = file ? await uploadAvatar(file) : (avatarInput || '👤');
                localStorage.setItem('pro_chat_name', myName);
                localStorage.setItem('pro_chat_avatar', myAvatar);

                document.getElementById('loginOverlay').style.display = 'none';
                initApp();
            } catch (error) {
                console.error(error);
                alert("প্রোফাইল ছবি আপলোড করা যায়নি। আবার চেষ্টা করুন।");
            }
        }

        function initApp() {
            // ফায়ারবেসে ইউজারের স্থায়ী প্রোফাইল আপডেট বা সেভ করা
            db.ref(`users/${myUid}`).update({
                name: myName,
                avatar: myAvatar,
                uid: myUid,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            updateMyUI();
            setupPresence();
            listenToSidebarData();
            startPresenceRefresh();
            switchChat('global', '🌐 গ্লোবাল চ্যাট রুম');
        }

        function renderAvatarElement(container, avatar, alt = 'Avatar') {
            container.innerHTML = '';
            const value = (avatar || '👤').trim();

            if (/^https?:\/\//i.test(value)) {
                const img = document.createElement('img');
                img.src = value;
                img.alt = alt;
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';
                img.onerror = () => { container.textContent = '👤'; };
                container.appendChild(img);
            } else {
                container.textContent = value;
            }
        }

        function normalizeAvatarInput(value) {
            return (value || '').trim() || '👤';
        }

        function updateMyUI() {
            document.getElementById('myProfileName').innerText = myName;
            renderAvatarElement(document.getElementById('mySidebarAvatar'), myAvatar, 'Avatar');
        }


        // সেটিংস মডাল ওপেন/ক্লোজ
        function openSettings() {
            document.getElementById('editNameInput').value = myName;
            document.getElementById('editAvatarInput').value = myAvatar;
            document.getElementById('settingsOverlay').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').style.display = 'none';
        }

        async function saveProfileChanges() {
            const newName = document.getElementById('editNameInput').value.trim();
            const newAvatar = normalizeAvatarInput(document.getElementById('editAvatarInput').value);

            if (!newName) {
                alert("নাম খালি রাখা যাবে না!");
                return;
            }

            const saveButton = document.querySelector('#settingsOverlay .modal-card button');
            if (saveButton) {
                saveButton.disabled = true;
                saveButton.textContent = 'সংরক্ষণ হচ্ছে...';
            }

            try {
                await db.ref(`users/${myUid}`).update({
                    name: newName,
                    avatar: newAvatar,
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });

                myName = newName;
                myAvatar = newAvatar;
                localStorage.setItem('pro_chat_name', myName);
                localStorage.setItem('pro_chat_avatar', myAvatar);

                updateMyUI();
                renderSidebar();
                updateChatHeaderPresence();
                closeSettings();
            } catch (error) {
                console.error(error);
                alert('Profile update করা যায়নি। Firebase connection/rules check করুন।');
            } finally {
                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent = 'সংরক্ষণ করুন';
                }
            }
        }


        async function uploadAvatar(file) {
            if (!file.type.startsWith('image/')) throw new Error('Invalid image');
            if (file.size > 2 * 1024 * 1024) throw new Error('Image too large');
            const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
            const ref = storage.ref(`avatars/${myUid}.${ext}`);
            await ref.put(file);
            return await ref.getDownloadURL();
        }

        // লাইভ প্রেজেন্স + last seen
        function setupPresence() {
            const myPresenceRef = db.ref(`presence/${myUid}`);
            const myUserRef = db.ref(`users/${myUid}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() !== true) return;

                // Firebase removes this record when this tab/browser disconnects.
                myPresenceRef.onDisconnect().remove();

                // Save last seen when the user goes offline.
                myUserRef.child('lastSeen').onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);

                // Set online immediately.
                myPresenceRef.set({
                    uid: myUid,
                    online: true,
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });

                myUserRef.update({
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            });

            // Extra safety for page/tab close or navigation.
            window.addEventListener('beforeunload', () => {
                myPresenceRef.remove();
                myUserRef.child('lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
            });
        }

        function formatLastSeen(timestamp) {
            if (!timestamp) return 'last seen recently';
            return 'last seen ' + new Date(timestamp).toLocaleString([], {
                day: '2-digit',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function updateChatHeaderPresence() {
            const statusEl = document.getElementById('currentChatStatus');

            if (currentChatType === 'global') {
                statusEl.textContent = 'Public Room';
                return;
            }

            const online = !!onlineUsers[targetUid];
            const profile = allUserProfiles[targetUid] || {};
            const lastSeen = profile.lastSeen || onlineUsers[targetUid]?.lastSeen;

            statusEl.textContent = online ? 'Active now' : formatLastSeen(lastSeen);
        }

        let presenceRefreshInterval = null;

        function startPresenceRefresh() {
            if (presenceRefreshInterval) clearInterval(presenceRefreshInterval);
            presenceRefreshInterval = setInterval(() => {
                renderSidebar();
                updateChatHeaderPresence();
            }, 5000);
        }

        function listenToSidebarData() {
            // ১. সব ইউজারের প্রোফাইল ইনফো ট্র্যাক করা (যাতে সবার সঠিক নাম ও ছবি পাওয়া যায়)
            db.ref('users').on('value', (snapshot) => {
                allUserProfiles = snapshot.val() || {};
                renderSidebar();
            });

            // ২. অনলাইন ইউজার ট্র্যাক করা
            db.ref('presence').on('value', (snapshot) => {
                onlineUsers = snapshot.val() || {};
                renderSidebar();
                updateChatHeaderPresence();
            });

            // ৩. নিজের রিসেন্ট চ্যাট ট্র্যাক করা
            db.ref(`recent_chats/${myUid}`).on('value', (snapshot) => {
                recentChats = snapshot.val() || {};

                Object.keys(recentChats).forEach(uid => {
                    const chat = recentChats[uid];
                    if (chat && chat.messageId) {
                        const messageRef = db.ref(`messages/private/${[myUid, uid].sort().join('_')}/${chat.messageId}`);

                        // Recipient's app has received the recent-chat update.
                        if (chat.unread) {
                            messageRef.update({
                                status: 'delivered',
                                deliveredAt: firebase.database.ServerValue.TIMESTAMP
                            }).catch(console.error);
                        }

                        // If this chat is currently open, mark incoming message as seen.
                        if (currentChatType === 'private' && targetUid === uid && chat.unread) {
                            messageRef.update({
                                status: 'seen',
                                seenAt: firebase.database.ServerValue.TIMESTAMP
                            }).catch(console.error);
                            db.ref(`recent_chats/${myUid}/${uid}/unread`).set(false);
                        }
                    }
                });

                renderSidebar();
                updateChatHeaderPresence();
            });
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            
            list.innerHTML = `
                <li class="chat-item ${currentChatType === 'global' ? 'active' : ''}" onclick="switchChat('global', '🌐 গ্লোবাল চ্যাট রুম')">
                    <div class="avatar">🌐</div>
                    <div class="chat-info">
                        <div class="title">গ্লোবাল চ্যাট রুম</div>
                        <div class="subtitle">সবার জন্য উন্মুক্ত চ্যাট</div>
                    </div>
                </li>
            `;

            let sidebarItems = [];

            // মেসেজ দেওয়া ইউজারদের লিস্টে আনা
            Object.keys(recentChats).forEach(uid => {
                const p = allUserProfiles[uid] || { name: 'Unknown', avatar: '👤' };
                sidebarItems.push({
                    uid: uid,
                    name: p.name,
                    avatar: p.avatar,
                    isOnline: !!onlineUsers[uid],
                    timestamp: recentChats[uid].timestamp || 0,
                    text: recentChats[uid].text,
                    unread: recentChats[uid].unread
                });
            });

            // অনলাইন ইউজার যারা মেসেজ দেয়নি
            Object.keys(onlineUsers).forEach(uid => {
                if (uid !== myUid && onlineUsers[uid] && !recentChats[uid]) {
                    const p = allUserProfiles[uid] || { name: 'User', avatar: '👤' };
                    sidebarItems.push({
                        uid: uid,
                        name: p.name,
                        avatar: p.avatar,
                        isOnline: true,
                        timestamp: 0, 
                        text: 'কথোপকথন শুরু করুন',
                        unread: false
                    });
                }
            });

            // টাইমস্ট্যাম্প অনুযায়ী রিসেন্ট চ্যাট উপরে সাজানো
            sidebarItems.sort((a, b) => b.timestamp - a.timestamp);

            sidebarItems.forEach(u => {
                const timeStr = u.timestamp ? new Date(u.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                const unreadBadge = u.unread ? `<div class="unread-badge">New</div>` : '';
                const subtitleClass = u.unread ? 'subtitle unread' : 'subtitle';
                const statusDot = u.isOnline ? `<div class="status-dot" title="Active now" aria-label="Active now"></div>` : '';

                const li = document.createElement('li');
                li.className = `chat-item ${targetUid === u.uid ? 'active' : ''}`;
                li.onclick = () => switchChat(u.uid, u.name);

                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (u.avatar && u.avatar.startsWith('http')) {
                    const img = document.createElement('img');
                    img.src = u.avatar;
                    img.alt = 'Avatar';
                    avatar.appendChild(img);
                } else {
                    avatar.textContent = u.avatar || '👤';
                }
                if (u.isOnline) {
                    const dot = document.createElement('div');
                    dot.className = 'status-dot';
                    avatar.appendChild(dot);
                }

                const info = document.createElement('div');
                info.className = 'chat-info';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'title';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = u.name || 'Unknown';
                const timeSpan = document.createElement('span');
                timeSpan.style.cssText = 'font-size:10px;color:var(--text-secondary);font-weight:normal;';
                timeSpan.textContent = timeStr;
                titleDiv.append(nameSpan, timeSpan);

                const subDiv = document.createElement('div');
                subDiv.className = subtitleClass;
                const textSpan = document.createElement('span');
                textSpan.style.cssText = 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%;';
                textSpan.textContent = u.text || '';
                subDiv.appendChild(textSpan);
                if (u.unread) {
                    const badge = document.createElement('div');
                    badge.className = 'unread-badge';
                    badge.textContent = 'New';
                    subDiv.appendChild(badge);
                }

                info.append(titleDiv, subDiv);
                li.append(avatar, info);
                list.appendChild(li);
            });
        }

        function saveDeletedMessages() {
            localStorage.setItem('pro_chat_deleted_messages', JSON.stringify(deletedMessages));
        }

        function messageLocalKey(chatPath, messageKey) {
            return `${chatPath}/${messageKey}`;
        }

        function deleteMessageForMe(chatPath, messageKey) {
            deletedMessages[messageLocalKey(chatPath, messageKey)] = true;
            saveDeletedMessages();
            const el = document.querySelector(`.message[data-message-key="${CSS.escape(messageKey)}"]`);
            if (el) el.remove();
        }


        function unsendMessage(chatPath, messageKey) {
            if (currentChatType !== 'private') {
                alert('Global chat message unsend করা এই version-এ disabled.');
                return;
            }

            db.ref(`${chatPath}/${messageKey}`).update({
                deleted: true,
                text: '',
                unsentAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                const el = document.querySelector(`.message[data-message-key="${CSS.escape(messageKey)}"]`);
                if (el) el.innerHTML = '<div class="unsent-message">This message was unsent</div>';
            }).catch(error => {
                console.error(error);
                alert('Message unsend করা যায়নি।');
            });
        }


        function switchChat(type, title) {
            currentChatType = (type === 'global') ? 'global' : 'private';
            targetUid = (type === 'global') ? null : type;
            targetName = title;

            document.getElementById('currentChatTitle').innerText = title;
            updateChatHeaderPresence();

            if (currentChatType === 'private' && recentChats[targetUid]?.unread) {
                db.ref(`recent_chats/${myUid}/${targetUid}/unread`).set(false);
            }

            renderSidebar();

            if (activeListenerRef) activeListenerRef.off();

            const messagesBox = document.getElementById('messagesBox');
            messagesBox.innerHTML = '';

            const chatPath = (currentChatType === 'global')
                ? 'messages/global'
                : `messages/private/${[myUid, targetUid].sort().join('_')}`;

            activeListenerRef = db.ref(chatPath).limitToLast(60);

            // value listener is used so sent/delivered/seen status updates live.
            activeListenerRef.on('value', (snapshot) => {
                messagesBox.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val() || {};
                    msg._key = child.key;

                    if (deletedMessages[messageLocalKey(chatPath, child.key)]) return;

                    // Opening the conversation means incoming messages are seen.
                    if (currentChatType === 'private' &&
                        msg.senderUid === targetUid &&
                        !msg.deleted &&
                        msg.status !== 'seen') {
                        db.ref(`${chatPath}/${child.key}`).update({
                            status: 'seen',
                            seenAt: firebase.database.ServerValue.TIMESTAMP
                        });
                    }

                    renderMessage(msg, chatPath);
                });
            });

            // Mark the latest recent message as seen when opening the chat.
            if (currentChatType === 'private' && recentChats[targetUid]?.messageId) {
                db.ref(`messages/private/${[myUid, targetUid].sort().join('_')}/${recentChats[targetUid].messageId}`).update({
                    status: 'seen',
                    seenAt: firebase.database.ServerValue.TIMESTAMP
                });
                db.ref(`recent_chats/${myUid}/${targetUid}/unread`).set(false);
            }
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const ts = firebase.database.ServerValue.TIMESTAMP;
            const msgData = {
                senderUid: myUid,
                senderName: myName,
                senderAvatar: myAvatar,
                text: text,
                timestamp: ts,
                status: currentChatType === 'private' ? 'sent' : 'sent'
            };

            const updates = {};

            if (currentChatType === 'global') {
                const newMsgKey = db.ref('messages/global').push().key;
                updates[`messages/global/${newMsgKey}`] = msgData;
            } else {
                const dmId = [myUid, targetUid].sort().join('_');
                const newMsgKey = db.ref(`messages/private/${dmId}`).push().key;
                msgData.messageId = newMsgKey;

                updates[`messages/private/${dmId}/${newMsgKey}`] = msgData;

                updates[`recent_chats/${myUid}/${targetUid}`] = {
                    timestamp: ts,
                    text: text,
                    unread: false,
                    partnerName: targetName,
                    messageId: newMsgKey,
                    lastSenderUid: myUid
                };

                updates[`recent_chats/${targetUid}/${myUid}`] = {
                    timestamp: ts,
                    text: text,
                    unread: true,
                    partnerName: myName,
                    messageId: newMsgKey,
                    lastSenderUid: myUid
                };
            }

            db.ref().update(updates)
                .then(() => {
                    input.value = '';
                })
                .catch(error => {
                    console.error(error);
                    alert("Message পাঠানো যায়নি। আবার চেষ্টা করুন।");
                });
        }

        // Mobile/iPad: actions stay hidden. Long-press a message to reveal them briefly.
        let longPressTimer = null;
        let longPressTriggered = false;

        function hideAllMessageActions() {
            document.querySelectorAll('.message-actions.touch-visible').forEach(a => {
                a.classList.remove('touch-visible');
            });
        }

        document.addEventListener('touchstart', (e) => {
            const message = e.target.closest('.message');
            if (!message) {
                hideAllMessageActions();
                return;
            }

            longPressTriggered = false;
            longPressTimer = setTimeout(() => {
                hideAllMessageActions();
                const actions = message.querySelector('.message-actions');
                if (actions) {
                    actions.classList.add('touch-visible');
                    longPressTriggered = true;
                    setTimeout(() => actions.classList.remove('touch-visible'), 3500);
                }
            }, 500);
        }, {passive:true});

        document.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
        }, {passive:true});

        document.addEventListener('touchmove', () => {
            clearTimeout(longPressTimer);
        }, {passive:true});

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.message-actions')) {
                hideAllMessageActions();
            }
        });

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function renderMessage(msg, chatPath) {
            const box = document.getElementById('messagesBox');
            const isMe = msg.senderUid === myUid;
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'sent' : 'received'}`;
            if (msg._key) div.dataset.messageKey = msg._key;

            if (msg.deleted) {
                div.innerHTML = `<div class="unsent-message">This message was unsent</div>`;
                box.appendChild(div);
                return;
            }

            const timeString = msg.timestamp
                ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                : '';

            let statusHTML = '';
            let statusTitle = '';

            if (isMe && currentChatType === 'private') {
                if (msg.status === 'seen') {
                    const seenTime = msg.seenAt
                        ? new Date(msg.seenAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                        : 'Seen';
                    statusHTML = '<span class="msg-status seen">✓✓</span>';
                    statusTitle = `Seen ${seenTime}`;
                } else if (msg.status === 'delivered') {
                    const deliveredTime = msg.deliveredAt
                        ? new Date(msg.deliveredAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                        : 'Delivered';
                    statusHTML = '<span class="msg-status delivered">✓✓</span>';
                    statusTitle = `Delivered ${deliveredTime}`;
                } else {
                    statusHTML = '<span class="msg-status sent">✓</span>';
                    statusTitle = 'Sent';
                }
            }

            let actionsHTML = '';
            if (msg._key) {
                actionsHTML = `<div class="message-actions">
                    ${isMe && currentChatType === 'private'
                        ? `<button type="button" class="msg-action-btn unsend-btn" title="Unsend">↩</button>`
                        : ''}
                    <button type="button" class="msg-action-btn delete-btn" title="Delete">🗑</button>
                </div>`;
            }

            div.innerHTML = `
                ${actionsHTML}
                ${!isMe ? `<div class="msg-sender">${escapeHTML(msg.senderName || 'Unknown')}</div>` : ''}
                <div class="msg-content">${escapeHTML(msg.text || '')}</div>
                <div class="msg-time" title="${statusTitle}">${timeString}${statusHTML}</div>
            `;

            const unsendBtn = div.querySelector('.unsend-btn');
            if (unsendBtn) unsendBtn.onclick = (e) => {
                e.stopPropagation();
                unsendMessage(chatPath, msg._key);
            };

            const deleteBtn = div.querySelector('.delete-btn');
            if (deleteBtn) deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteMessageForMe(chatPath, msg._key);
            };

            box.appendChild(div);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }
    </script>
</body>
</html>
